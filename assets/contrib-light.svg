      0%,96.4% { transform: translate(0,0); }
      96.8% { transform: translate(2px,-1.5px); }
      97.2% { transform: translate(-2px,1px); }
      97.6% { transform: translate(1px,.5px); }
      100% { transform: translate(0,0); }
    }
