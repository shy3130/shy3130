<svg xmlns="http://www.w3.org/2000/svg" width="846" height="312" viewBox="0 0 846 312" role="img" aria-label="wshy — 写代码 · 做开源 · 造工具">
  <title>wshy — 写代码 · 做开源 · 造工具</title>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c9c00" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c9c00" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(34px,-18px); } }
      @keyframes pulse { 0%,100% { opacity:.3; } 50% { opacity:1; } }
      .glow { animation: drift 19s ease-in-out infinite; }
      .dot  { animation: pulse 4.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .glow, .dot { animation: none; } }
    </style>
  </defs>

  <rect width="846" height="312" fill="#f9f9f5"/>
  <ellipse class="glow" cx="110" cy="300" rx="290" ry="200" fill="url(#glow)"/>
  <rect width="846" height="312" filter="url(#grain)" opacity="0.03"/>

  <g stroke="#e3e3dc" stroke-width="1">
    <line x1="0" y1="56" x2="846" y2="56"/>
    <line x1="0" y1="258" x2="846" y2="258"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#8b9099" letter-spacing="2.6">
    <text x="0" y="44">SHY3130</text>
    <text x="846" y="44" text-anchor="end">GITHUB PROFILE</text>
  </g>
  <circle class="dot" cx="66" cy="41" r="2.2" fill="#7c9c00"/>

  <text x="-2" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"
        font-size="127" font-weight="700" letter-spacing="-5.5" fill="#101215">wshy</text>

  <text x="0" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"
        font-size="16" letter-spacing="1.8" fill="#585e66">写代码 · 做开源 · 造工具</text>

  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#8b9099" letter-spacing="2">
    <text x="0" y="284">EST. 2014</text>
    <text x="423" y="284" text-anchor="middle">SELF-HOSTED · API-FIRST · ZERO-OPS</text>
    <text x="846" y="284" text-anchor="end">TSP.SHY313.COM</text>
  </g>

  <line x1="586" y1="96" x2="586" y2="208" stroke="#7c9c00" stroke-width="1.5"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="602" y="100" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="2.6" fill="#8b9099">FOCUS</text>
    <g font-size="15" fill="#2c3037">
      <text x="602" y="138">01</text><text x="632" y="138">A 股量化工作台</text>
      <text x="602" y="170">02</text><text x="632" y="170">LLM 工具链与插件</text>
      <text x="602" y="202">03</text><text x="632" y="202">开源 · 长期维护</text>
    </g>
  </g>
  <g stroke="#e3e3dc" stroke-width="1">
    <line x1="602" y1="148" x2="846" y2="148"/>
    <line x1="602" y1="180" x2="846" y2="180"/>
  </g>
</svg>
