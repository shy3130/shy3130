  <text x="48" y="258" font-family="ui-monospace, SFMono-Regular, JetBrains Mono, Menlo, Consolas, monospace" font-size="12" fill="#6e7681">FastAPI · React · TypeScript · Polars · DuckDB · Docker · LLM</text>
