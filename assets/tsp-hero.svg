    <rect class="candle" x="727" y="156" width="10" height="18" rx="1.5" fill="#ef5350" style="animation-delay:0.91s"/>
    <rect class="candle" x="749" y="148" width="10" height="12" rx="1.5" fill="#26a69a" style="animation-delay:0.98s"/>
    <rect class="candle" x="771" y="136" width="10" height="22" rx="1.5" fill="#ef5350" style="animation-delay:1.05s"/>
    <rect class="candle" x="793" y="126" width="10" height="10" rx="1.5" fill="#26a69a" style="animation-delay:1.12s"/>
    <rect class="candle" x="815" y="112" width="10" height="20" rx="1.5" fill="#ef5350" style="animation-delay:1.19s"/>
    <rect class="candle" x="837" y="102" width="10" height="14" rx="1.5" fill="#26a69a" style="animation-delay:1.26s"/>
    <rect class="candle" x="859" y="90" width="10" height="24" rx="1.5" fill="#ef5350" style="animation-delay:1.33s"/>
  </g>

  <!-- trend line -->
  <path class="trend" d="M556,208 L578,196 L600,192 L622,190 L644,176 L666,172 L688,160 L710,164 L732,152 L754,144 L776,132 L798,122 L820,108 L842,98 L864,82" stroke="url(#line)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.16" fill="none"/>
  <path class="trend" d="M556,208 L578,196 L600,192 L622,190 L644,176 L666,172 L688,160 L710,164 L732,152 L754,144 L776,132 L798,122 L820,108 L842,98 L864,82" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle class="dot" cx="864" cy="82" r="4" fill="#22d3ee"/>

  <!-- border hairline -->
  <rect x="0.5" y="0.5" width="919" height="279" rx="19.5" stroke="url(#aurora)" stroke-opacity="0.55" stroke-width="1" fill="none"/>

