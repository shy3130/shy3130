<svg width="980" height="348" viewBox="0 0 980 348" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tick-stock-panel — A 股智能量化工作台">
  <title>tick-stock-panel — A 股智能量化工作台 · 自托管 · 零运维 · 核心能力全部开放成接口</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="orbV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-18px,12px); } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(14px,-10px); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0%,100% { opacity: 0.95; } 50% { opacity: 0.25; } }
      .orb-v { animation: drift1 13s ease-in-out infinite; }
      .orb-c { animation: drift2 15s ease-in-out infinite; }
      .candle, .wick { opacity: 0; animation: rise 0.5s cubic-bezier(0.32,0.72,0,1) forwards; }
      .trend { stroke-dasharray: 620; stroke-dashoffset: 620; animation: draw 2.6s 0.4s cubic-bezier(0.32,0.72,0,1) forwards; }
      .row { opacity: 0; animation: fadein 0.6s ease-out forwards; }
      .live { animation: pulse 2s ease-in-out infinite; }
      text { user-select: none; }
    </style>
  </defs>

  <rect width="980" height="348" rx="20" fill="url(#bg)"/>
  <ellipse class="orb-v" cx="880" cy="20" rx="300" ry="180" fill="url(#orbV)"/>
  <ellipse class="orb-c" cx="70" cy="360" rx="310" ry="200" fill="url(#orbC)"/>

