  <text x="48" y="172" font-family="-apple-system, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#9aa4b2">A 股智能量化工作台 · 自托管 · 零运维 · LLM 驱动</text>

