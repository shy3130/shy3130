    <line class="wick" x1="732" y1="149" x2="732" y2="181" stroke="#ef5350" style="animation-delay:0.91s"/>
    <line class="wick" x1="754" y1="141" x2="754" y2="167" stroke="#26a69a" style="animation-delay:0.98s"/>
    <line class="wick" x1="776" y1="129" x2="776" y2="165" stroke="#ef5350" style="animation-delay:1.05s"/>
    <line class="wick" x1="798" y1="119" x2="798" y2="143" stroke="#26a69a" style="animation-delay:1.12s"/>
