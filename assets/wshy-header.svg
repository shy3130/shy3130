<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="wshy — 写代码 · 做开源 · 造工具">
  <title>wshy · 写代码 · 做开源 · 造工具</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#090d13"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="orbV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="card">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
    <clipPath id="wordClip">
      <text x="600" y="196" text-anchor="middle" font-family="-apple-system, SF Pro Display, PingFang SC, Microsoft YaHei, sans-serif" font-size="132" font-weight="800" letter-spacing="6">wshy</text>
    </clipPath>
    <style>
      @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-22px,14px); } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(16px,-12px); } }
      @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-14px,-10px); } }
      @keyframes waveL { from { transform: translateX(0); } to { transform: translateX(200px); } }
      @keyframes waveR { from { transform: translateX(0); } to { transform: translateX(-200px); } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes sheen { 0% { transform: translateX(-480px) rotate(16deg); } 45%,100% { transform: translateX(560px) rotate(16deg); } }
      @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.65; } }
      .orb-v { animation: drift1 13s ease-in-out infinite; }
      .orb-c { animation: drift2 16s ease-in-out infinite; }
      .orb-m { animation: drift3 19s ease-in-out infinite; }
      .wave-l { animation: waveL 9s linear infinite; }
      .wave-r { animation: waveR 7s linear infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .sheen-band { animation: sheen 5.5s ease-in-out infinite; }
      .tw { animation: twinkle 4s ease-in-out infinite; }
      text { user-select: none; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <ellipse class="orb-v" cx="1050" cy="30" rx="300" ry="180" fill="url(#orbV)"/>
    <ellipse class="orb-c" cx="130" cy="310" rx="280" ry="170" fill="url(#orbC)"/>
    <ellipse class="orb-m" cx="640" cy="-40" rx="220" ry="110" fill="url(#orbM)"/>

    <!-- starfield -->
    <g fill="#e6edf3">
      <circle cx="60" cy="60" r="1.6" opacity="0.3"/>
      <circle cx="140" cy="180" r="1.2" opacity="0.2"/>
      <circle cx="90" cy="240" r="1.5" opacity="0.25" class="tw" style="animation-delay:0.4s"/>
      <circle cx="210" cy="90" r="1.3" opacity="0.3"/>
      <circle cx="300" cy="150" r="1.1" opacity="0.15"/>
      <circle cx="250" cy="230" r="1.4" opacity="0.2"/>
      <circle cx="360" cy="60" r="1.2" opacity="0.25"/>
      <circle cx="1120" cy="150" r="1.4" opacity="0.25"/>
      <circle cx="1060" cy="240" r="1.6" opacity="0.3" class="tw" style="animation-delay:1.2s"/>
      <circle cx="960" cy="80" r="1.2" opacity="0.2"/>
      <circle cx="1180" cy="70" r="1.5" opacity="0.3"/>
      <circle cx="900" cy="200" r="1.1" opacity="0.15"/>
      <circle cx="880" cy="40" r="1.3" opacity="0.25"/>
      <circle cx="1150" cy="190" r="1.2" opacity="0.2" class="tw" style="animation-delay:2.1s"/>
      <circle cx="50" cy="140" r="1.2" opacity="0.2"/>
      <circle cx="160" cy="40" r="1.5" opacity="0.3"/>
      <circle cx="1140" cy="110" r="1.6" opacity="0.35" class="tw" style="animation-delay:3s"/>
      <circle cx="1000" cy="260" r="1.2" opacity="0.2"/>
      <circle cx="330" cy="250" r="1.3" opacity="0.2"/>
      <circle cx="70" cy="190" r="1.1" opacity="0.15"/>
      <circle cx="1180" cy="250" r="1.4" opacity="0.25"/>
      <circle cx="420" cy="58" r="1.4" opacity="0.28"/>
      <circle cx="780" cy="52" r="1.2" opacity="0.2"/>
      <circle cx="820" cy="255" r="1.5" opacity="0.3" class="tw" style="animation-delay:1.8s"/>
      <circle cx="520" cy="268" r="1.2" opacity="0.2"/>
      <circle cx="600" cy="58" r="1.3" opacity="0.22"/>
    </g>

    <!-- corner HUD brackets -->
    <g stroke="url(#aurora)" stroke-width="2" stroke-opacity="0.55" fill="none" stroke-linecap="round">
      <path d="M26 54 V34 Q26 26 34 26 H54"/>
      <path d="M1146 26 H1166 Q1174 26 1174 34 V54"/>
      <path d="M1174 266 V286 Q1174 294 1166 294 H1146"/>
      <path d="M54 294 H34 Q26 294 26 286 V266"/>
    </g>

    <!-- eyebrow -->
    <line x1="410" y1="88" x2="488" y2="88" stroke="#22d3ee" stroke-opacity="0.45"/>
    <line x1="712" y1="88" x2="790" y2="88" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="600" y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, JetBrains Mono, Menlo, Consolas, monospace" font-size="15" font-weight="500" letter-spacing="6" fill="#22d3ee">HELLO, I AM</text>

    <!-- wordmark: glow underlay + gradient fill + sheen sweep -->
    <text x="600" y="196" text-anchor="middle" font-family="-apple-system, SF Pro Display, PingFang SC, Microsoft YaHei, sans-serif" font-size="132" font-weight="800" letter-spacing="6" fill="url(#wordGrad)" opacity="0.5" filter="url(#glow)">wshy</text>
    <text x="600" y="196" text-anchor="middle" font-family="-apple-system, SF Pro Display, PingFang SC, Microsoft YaHei, sans-serif" font-size="132" font-weight="800" letter-spacing="6" fill="url(#wordGrad)">wshy</text>
    <g clip-path="url(#wordClip)">
      <rect class="sheen-band" x="-60" y="60" width="110" height="160" fill="#ffffff" opacity="0.22"/>
    </g>
    <rect class="cursor" x="778" y="118" width="11" height="72" rx="2" fill="#22d3ee" opacity="0.9"/>

    <!-- signature line -->
    <text x="600" y="240" text-anchor="middle" font-family="-apple-system, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="21" font-weight="500" letter-spacing="2" fill="#9aa4b2">写代码 · 做开源 · 造工具</text>

    <!-- waves -->
    <g class="wave-r">
      <path d="M-400 302 Q -350 286 -300 302 T -200 302 T -100 302 T 0 302 T 100 302 T 200 302 T 300 302 T 400 302 T 500 302 T 600 302 T 700 302 T 800 302 T 900 302 T 1000 302 T 1100 302 T 1200 302 T 1300 302 T 1400 302 T 1500 302 T 1600 302 L 1600 320 L -400 320 Z" fill="#22d3ee" fill-opacity="0.14"/>
    </g>
    <g class="wave-l">
      <path d="M-400 294 Q -350 276 -300 294 T -200 294 T -100 294 T 0 294 T 100 294 T 200 294 T 300 294 T 400 294 T 500 294 T 600 294 T 700 294 T 800 294 T 900 294 T 1000 294 T 1100 294 T 1200 294 T 1300 294 T 1400 294 T 1500 294 T 1600 294 L 1600 320 L -400 320 Z" fill="url(#aurora)" fill-opacity="0.22"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" stroke="url(#aurora)" stroke-opacity="0.55" stroke-width="1" fill="none"/>
</svg>
